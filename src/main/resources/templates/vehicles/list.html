<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vehicules')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${activeMenu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Vehicules</h1>
                <p>Le type de vehicule influence le tarif applique a la sortie.</p>
            </div>
            <a class="btn primary" th:href="@{/vehicles/new}">Nouveau vehicule</a>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <form class="filters" method="get" th:action="@{/vehicles}">
                <div class="field wide">
                    <label for="search">Recherche (immatriculation, marque, proprietaire)</label>
                    <input type="text" id="search" name="search" th:value="${search}">
                </div>
                <div class="field">
                    <label for="type">Type</label>
                    <select id="type" name="type">
                        <option value="">Tous</option>
                        <option th:each="t : ${vehicleTypes}" th:value="${t}" th:text="${t.label}"
                                th:selected="${t == type}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="ownerId">Proprietaire</label>
                    <select id="ownerId" name="ownerId">
                        <option value="">Tous</option>
                        <option th:each="u : ${users}" th:value="${u.id()}" th:text="${u.fullName()}"
                                th:selected="${u.id() == ownerId}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="sort">Tri</label>
                    <select id="sort" name="sort">
                        <option value="plateNumber,asc">Immatriculation</option>
                        <option value="brand,asc">Marque</option>
                        <option value="type,asc">Type</option>
                    </select>
                </div>
                <button class="btn primary" type="submit">Filtrer</button>
                <a class="btn" th:href="@{/vehicles}">Reinitialiser</a>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Immatriculation</th>
                        <th>Marque</th>
                        <th>Modele</th>
                        <th>Couleur</th>
                        <th>Type</th>
                        <th>Proprietaire</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="vehicle : ${page.content}">
                        <td><strong th:text="${vehicle.plateNumber()}"></strong></td>
                        <td th:text="${vehicle.brand()}"></td>
                        <td th:text="${vehicle.model()}"></td>
                        <td th:text="${vehicle.color()}"></td>
                        <td th:text="${vehicle.typeLabel()}"></td>
                        <td th:text="${vehicle.ownerName()}"></td>
                        <td>
                            <a class="btn small" th:href="@{'/vehicles/' + ${vehicle.id()} + '/edit'}">Modifier</a>
                            <form class="inline-form" method="post"
                                  th:action="@{'/vehicles/' + ${vehicle.id()} + '/delete'}"
                                  onsubmit="return confirm('Supprimer ce vehicule ?');">
                                <button class="btn small danger" type="submit">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${page.totalElements == 0}">Aucun vehicule trouve.</div>
            </div>

            <div th:replace="~{fragments/layout :: pager(${page}, '/vehicles', ${filterQuery})}"></div>
        </div>
    </main>
</div>
</body>
</html>
