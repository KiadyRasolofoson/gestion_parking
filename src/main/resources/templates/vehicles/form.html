<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nouveau vehicule')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${activeMenu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Nouveau vehicule</h1>
                <p>L'immatriculation est unique et sert d'identifiant aux entrees / sorties.</p>
            </div>
            <a class="btn" th:href="@{/vehicles}">Retour</a>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <form th:action="@{/vehicles}" th:object="${form}" method="post">
                <div class="form-grid">
                    <div class="field">
                        <label for="plateNumber">Immatriculation</label>
                        <input type="text" id="plateNumber" th:field="*{plateNumber}">
                        <span class="error-text" th:if="${#fields.hasErrors('plateNumber')}"
                              th:errors="*{plateNumber}"></span>
                    </div>
                    <div class="field">
                        <label for="brand">Marque</label>
                        <input type="text" id="brand" th:field="*{brand}">
                    </div>
                    <div class="field">
                        <label for="model">Modele</label>
                        <input type="text" id="model" th:field="*{model}">
                    </div>
                    <div class="field">
                        <label for="color">Couleur</label>
                        <input type="text" id="color" th:field="*{color}">
                    </div>
                    <div class="field">
                        <label for="type">Type</label>
                        <select id="type" th:field="*{type}">
                            <option th:each="t : ${vehicleTypes}" th:value="${t}"
                                    th:text="${t.label} + ' (coefficient ' + ${t.coefficient} + ')'"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="ownerId">Proprietaire</label>
                        <select id="ownerId" th:field="*{ownerId}">
                            <option value="">-- Choisir --</option>
                            <option th:each="u : ${users}" th:value="${u.id()}"
                                    th:text="${u.fullName()} + ' (' + ${u.category().label} + ')'"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('ownerId')}"
                              th:errors="*{ownerId}"></span>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn primary" type="submit">Enregistrer</button>
                    <a class="btn" th:href="@{/vehicles}">Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
