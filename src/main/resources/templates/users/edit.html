<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier un compte')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${activeMenu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Modifier le compte</h1>
                <p>Laissez le mot de passe vide pour le conserver.</p>
            </div>
            <a class="btn" th:href="@{/users}">Retour</a>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <form th:action="@{'/users/' + ${userId}}" th:object="${form}" method="post">
                <div class="form-grid">
                    <div class="field">
                        <label for="firstName">Prenom</label>
                        <input type="text" id="firstName" th:field="*{firstName}">
                        <span class="error-text" th:if="${#fields.hasErrors('firstName')}"
                              th:errors="*{firstName}"></span>
                    </div>
                    <div class="field">
                        <label for="lastName">Nom</label>
                        <input type="text" id="lastName" th:field="*{lastName}">
                        <span class="error-text" th:if="${#fields.hasErrors('lastName')}"
                              th:errors="*{lastName}"></span>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}">
                        <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                    <div class="field">
                        <label for="phone">Telephone</label>
                        <input type="text" id="phone" th:field="*{phone}">
                        <span class="error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </div>
                    <div class="field">
                        <label for="role">Role</label>
                        <select id="role" th:field="*{role}">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="category">Categorie</label>
                        <select id="category" th:field="*{category}">
                            <option th:each="c : ${userCategories}" th:value="${c}" th:text="${c.label}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="enabled">Compte actif</label>
                        <select id="enabled" th:field="*{enabled}">
                            <option value="true">Oui</option>
                            <option value="false">Non</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="newPassword">Nouveau mot de passe</label>
                        <input type="password" id="newPassword" th:field="*{newPassword}"
                               placeholder="Laisser vide pour conserver">
                        <span class="error-text" th:if="${#fields.hasErrors('newPassword')}"
                              th:errors="*{newPassword}"></span>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn primary" type="submit">Enregistrer</button>
                    <a class="btn" th:href="@{/users}">Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
