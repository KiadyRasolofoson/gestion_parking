<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Facturation')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${activeMenu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Facturation</h1>
                <p>Une facture est emise automatiquement a chaque sortie de vehicule.</p>
            </div>
            <a class="btn" th:href="@{/statistics}">Statistiques</a>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <form class="filters" method="get" th:action="@{/invoices}">
                <div class="field wide">
                    <label for="search">Recherche (reference facture, session, client)</label>
                    <input type="text" id="search" name="search" th:value="${search}">
                </div>
                <div class="field">
                    <label for="status">Statut</label>
                    <select id="status" name="status">
                        <option value="">Tous</option>
                        <option th:each="s : ${invoiceStatuses}" th:value="${s}" th:text="${s.label}"
                                th:selected="${s == status}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="sort">Tri</label>
                    <select id="sort" name="sort">
                        <option value="issuedAt,desc">Emission (recent)</option>
                        <option value="totalAmount,desc">Montant decroissant</option>
                        <option value="totalAmount,asc">Montant croissant</option>
                    </select>
                </div>
                <button class="btn primary" type="submit">Filtrer</button>
                <a class="btn" th:href="@{/invoices}">Reinitialiser</a>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Client</th>
                        <th>Vehicule</th>
                        <th>Place</th>
                        <th>Duree facturee</th>
                        <th>Depassement</th>
                        <th>Total</th>
                        <th>Statut</th>
                        <th>Emise le</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="invoice : ${page.content}">
                        <td><a th:href="@{'/invoices/' + ${invoice.id()}}" th:text="${invoice.reference()}"></a></td>
                        <td th:text="${invoice.userName()}"></td>
                        <td th:text="${invoice.plateNumber()}"></td>
                        <td th:text="${invoice.spaceNumber()}"></td>
                        <td th:text="${invoice.billedMinutes()} + ' min'"></td>
                        <td th:text="${invoice.overstayMinutes()} + ' min'"></td>
                        <td><strong th:text="${invoice.totalAmount()} + ' ' + ${currency}"></strong></td>
                        <td><span th:class="'badge ' + ${invoice.status().name()}"
                                  th:text="${invoice.statusLabel()}"></span></td>
                        <td th:text="${#temporals.format(invoice.issuedAt(), 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <form class="inline-form" method="post"
                                  th:action="@{'/invoices/' + ${invoice.id()} + '/pay'}"
                                  th:if="${invoice.status().name() == 'EN_ATTENTE'}">
                                <button class="btn small primary" type="submit">Encaisser</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${page.totalElements == 0}">Aucune facture trouvee.</div>
            </div>

            <div th:replace="~{fragments/layout :: pager(${page}, '/invoices', ${filterQuery})}"></div>
        </div>
    </main>
</div>
</body>
</html>
