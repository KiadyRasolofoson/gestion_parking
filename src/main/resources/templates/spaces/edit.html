<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier une place')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${activeMenu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Modifier la place</h1>
                <p>Les statuts RESERVEE et OCCUPEE sont pilotes automatiquement par les reservations
                    et les entrees / sorties.</p>
            </div>
            <a class="btn" th:href="@{/spaces}">Retour</a>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <form th:action="@{'/spaces/' + ${spaceId}}" th:object="${form}" method="post">
                <div class="form-grid">
                    <div class="field">
                        <label for="number">Numero</label>
                        <input type="text" id="number" th:field="*{number}">
                        <span class="error-text" th:if="${#fields.hasErrors('number')}"
                              th:errors="*{number}"></span>
                    </div>
                    <div class="field">
                        <label for="zone">Zone</label>
                        <input type="text" id="zone" th:field="*{zone}">
                        <span class="error-text" th:if="${#fields.hasErrors('zone')}" th:errors="*{zone}"></span>
                    </div>
                    <div class="field">
                        <label for="floor">Etage</label>
                        <input type="number" id="floor" min="0" th:field="*{floor}">
                        <span class="error-text" th:if="${#fields.hasErrors('floor')}" th:errors="*{floor}"></span>
                    </div>
                    <div class="field">
                        <label for="type">Type de place</label>
                        <select id="type" th:field="*{type}">
                            <option th:each="t : ${spaceTypes}" th:value="${t}" th:text="${t.label}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="status">Statut administratif</label>
                        <select id="status" th:field="*{status}">
                            <option value="">Ne pas modifier</option>
                            <option value="LIBRE">Libre</option>
                            <option value="HORS_SERVICE">Hors service</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="outOfServiceReason">Motif hors service</label>
                        <input type="text" id="outOfServiceReason" th:field="*{outOfServiceReason}">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn primary" type="submit">Enregistrer</button>
                    <a class="btn" th:href="@{/spaces}">Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
