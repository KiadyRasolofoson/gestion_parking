<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nouvelle place')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${activeMenu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Nouvelle place</h1>
                <p>La place est creee avec le statut LIBRE.</p>
            </div>
            <a class="btn" th:href="@{/spaces}">Retour</a>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <form th:action="@{/spaces}" th:object="${form}" method="post">
                <div class="form-grid">
                    <div class="field">
                        <label for="number">Numero</label>
                        <input type="text" id="number" th:field="*{number}" placeholder="A01">
                        <span class="error-text" th:if="${#fields.hasErrors('number')}"
                              th:errors="*{number}"></span>
                    </div>
                    <div class="field">
                        <label for="zone">Zone</label>
                        <input type="text" id="zone" th:field="*{zone}" placeholder="A">
                        <span class="error-text" th:if="${#fields.hasErrors('zone')}" th:errors="*{zone}"></span>
                    </div>
                    <div class="field">
                        <label for="floor">Etage</label>
                        <input type="number" id="floor" min="0" th:field="*{floor}">
                        <span class="error-text" th:if="${#fields.hasErrors('floor')}" th:errors="*{floor}"></span>
                    </div>
                    <div class="field">
                        <label for="type">Type de place</label>
                        <select id="type" th:field="*{type}">
                            <option th:each="t : ${spaceTypes}" th:value="${t}" th:text="${t.label}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn primary" type="submit">Creer la place</button>
                    <a class="btn" th:href="@{/spaces}">Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
