<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Places disponibles')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${activeMenu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Places disponibles</h1>
                <p>Places au statut LIBRE, filtrables par type et par zone.</p>
            </div>
            <a class="btn" th:href="@{/spaces/map}">Voir le plan</a>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <form class="filters" method="get" th:action="@{/spaces/available}">
                <div class="field">
                    <label for="type">Type</label>
                    <select id="type" name="type">
                        <option value="">Tous</option>
                        <option th:each="t : ${spaceTypes}" th:value="${t}" th:text="${t.label}"
                                th:selected="${t == type}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="zone">Zone</label>
                    <select id="zone" name="zone">
                        <option value="">Toutes</option>
                        <option th:each="z : ${zones}" th:value="${z}" th:text="${z}"
                                th:selected="${z == zone}"></option>
                    </select>
                </div>
                <button class="btn primary" type="submit">Filtrer</button>
                <a class="btn" th:href="@{/spaces/available}">Reinitialiser</a>
            </form>

            <p><strong th:text="${#lists.size(spaces)}">0</strong> place(s) disponible(s).</p>

            <div class="slot-grid">
                <div th:each="space : ${spaces}" class="slot LIBRE"
                     th:title="${space.typeLabel()} + ' - zone ' + ${space.zone()}">
                    <span th:text="${space.number()}">A01</span>
                    <small th:text="${space.typeLabel()}">Standard</small>
                </div>
            </div>
            <div class="empty" th:if="${#lists.isEmpty(spaces)}">Aucune place disponible pour ces criteres.</div>
        </div>
    </main>
</div>
</body>
</html>
