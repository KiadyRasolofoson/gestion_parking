<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Places')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${activeMenu})}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Places de parking</h1>
                <p>Recherche, filtres, tri et pagination sur l'ensemble des places.</p>
            </div>
            <a sec:authorize="hasRole('ADMIN')" class="btn primary" th:href="@{/spaces/new}">Nouvelle place</a>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <form class="filters" method="get" th:action="@{/spaces}">
                <div class="field wide">
                    <label for="search">Recherche (numero, zone)</label>
                    <input type="text" id="search" name="search" th:value="${search}" placeholder="A01, zone B...">
                </div>
                <div class="field">
                    <label for="zone">Zone</label>
                    <select id="zone" name="zone">
                        <option value="">Toutes</option>
                        <option th:each="z : ${zones}" th:value="${z}" th:text="${z}"
                                th:selected="${z == zone}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="type">Type</label>
                    <select id="type" name="type">
                        <option value="">Tous</option>
                        <option th:each="t : ${spaceTypes}" th:value="${t}" th:text="${t.label}"
                                th:selected="${t == type}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="status">Statut</label>
                    <select id="status" name="status">
                        <option value="">Tous</option>
                        <option th:each="s : ${spaceStatuses}" th:value="${s}" th:text="${s.label}"
                                th:selected="${s == status}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="floor">Etage</label>
                    <input type="number" id="floor" name="floor" min="0" th:value="${floor}">
                </div>
                <div class="field">
                    <label for="sort">Tri</label>
                    <select id="sort" name="sort">
                        <option value="zone,asc">Zone croissante</option>
                        <option value="number,asc">Numero croissant</option>
                        <option value="number,desc">Numero decroissant</option>
                        <option value="status,asc">Statut</option>
                        <option value="type,asc">Type</option>
                    </select>
                </div>
                <button class="btn primary" type="submit">Filtrer</button>
                <a class="btn" th:href="@{/spaces}">Reinitialiser</a>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Numero</th>
                        <th>Zone</th>
                        <th>Etage</th>
                        <th>Type</th>
                        <th>Statut</th>
                        <th>Motif hors service</th>
                        <th sec:authorize="hasRole('ADMIN')">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="space : ${page.content}">
                        <td><strong th:text="${space.number()}"></strong></td>
                        <td th:text="${space.zone()}"></td>
                        <td th:text="${space.floor()}"></td>
                        <td>
                            <span th:class="'badge ' + ${space.type().name()}" th:text="${space.typeLabel()}"></span>
                        </td>
                        <td>
                            <span th:class="'badge ' + ${space.status().name()}"
                                  th:text="${space.statusLabel()}"></span>
                        </td>
                        <td th:text="${space.outOfServiceReason()}"></td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a class="btn small" th:href="@{'/spaces/' + ${space.id()} + '/edit'}">Modifier</a>
                            <form class="inline-form" method="post"
                                  th:action="@{'/spaces/' + ${space.id()} + '/out-of-service'}"
                                  th:if="${space.status().name() != 'HORS_SERVICE'}">
                                <input type="hidden" name="reason" value="Maintenance">
                                <button class="btn small" type="submit">Hors service</button>
                            </form>
                            <form class="inline-form" method="post"
                                  th:action="@{'/spaces/' + ${space.id()} + '/in-service'}"
                                  th:if="${space.status().name() == 'HORS_SERVICE'}">
                                <button class="btn small" type="submit">Remettre en service</button>
                            </form>
                            <form class="inline-form" method="post"
                                  th:action="@{'/spaces/' + ${space.id()} + '/delete'}"
                                  onsubmit="return confirm('Supprimer definitivement cette place ?');">
                                <button class="btn small danger" type="submit">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${page.totalElements == 0}">Aucune place ne correspond aux criteres.</div>
            </div>

            <div th:replace="~{fragments/layout :: pager(${page}, '/spaces', ${filterQuery})}"></div>
        </div>
    </main>
</div>
</body>
</html>
